name: Build and Test

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths-ignore:
      - "deployment/**"
      - ".github/**"
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Install Dependencies
        run: |
          go mod download

      - name: Install swag CLI
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          echo "$GOPATH/bin" >> $GITHUB_PATH

      - name: Generate Swagger Docs
        run: |
          swag init -g cmd/api/main.go -o docs

      - name: Build Go Binary
        run: |
          go build -ldflags="-s -w" -o app ./cmd/api

      - name: Build Container Image
        run: |
          docker build -t go-chi-app:latest -f Containerfile .

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: go-chi-app:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Test Full Stack with Docker Compose
        run: |
          make compose-up

          echo "Waiting for Go service to be healthy..."
          timeout=60
          while ! curl -sSf http://localhost:8080/system/health; do
            sleep 2
            timeout=$((timeout-2))
            if [ $timeout -le 0 ]; then
              echo "Go service did not become healthy in time"
              make compose-down
              exit 1
            fi
          done

          echo "Go service is healthy!"

          curl -sSf http://localhost:8080/api/version

          make compose-down
